# Netlify settings for the Nerdy Birdie Gaming site (a separate Netlify site from cozmc.us).
# Address: https://guides.nerdy-birdie.com (custom domain, DNS at Squarespace); also nerdybirdiegameguides.netlify.app. Password-protected for now.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"
  # Public build: canonical URLs + sitemap, search engines allowed, preview-only content hidden.
  SITE_URL = "https://guides.nerdy-birdie.com"
  PUBLIC_INDEXABLE = "true"
  # Keep the What's New creator feed on in the public build (founder, 24 Nov 2026).
  PUBLIC_DISCOVERY_FEED = "true"

# Spoiler data and the search index are never indexed.
[[headers]]
  for = "/data/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    # Astro's island loaders are inline scripts, so script-src allows 'unsafe-inline'. Everything else is locked down:
    # no third-party scripts, frames only from the three video players, connections only to this site (+ Supabase when on).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src https://www.youtube-nocookie.com https://player.twitch.tv https://clips.twitch.tv https://www.tiktok.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

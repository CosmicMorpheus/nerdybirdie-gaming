# Netlify settings for the Nerdy Birdie Gaming site (a separate Netlify site from cozmc.us).
# Not deployed yet: deploying needs founder approval.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"
  # At launch, after approval: set SITE_URL and PUBLIC_INDEXABLE = "true" in the Netlify UI.

# Spoiler data and the search index are never indexed.
[[headers]]
  for = "/data/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
